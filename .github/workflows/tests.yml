# Runs the test suite on a machine that has never seen this project.
#
# WHY THIS IS WORTH HAVING FOR A SOLO PROJECT
#
# Not to catch a colleague's mistake - there are no colleagues. To catch the
# class of bug that only exists because every run so far happened in one place.
#
# It found one before it was even committed. Five tests in test_company_client
# stubbed the network and asserted on the error, and passed for weeks by
# silently reading the developer's real .env: conftest set GROQ_API_KEY and
# NEWS_API_KEY but not FMP_API_KEY. On any machine without that untracked file
# they failed. A green suite that depends on a file nobody else has is evidence
# the code works HERE, not that it works.
#
# NO SECRETS ARE CONFIGURED, ON PURPOSE
#
# The suite must never need one. tests/conftest.py sets dummy credentials for
# every provider and an autouse fixture makes reaching the real research agent
# an immediate, explanatory failure. If a run here ever needs a key added, the
# right response is to fix the test, not to add the key - see
# tests/test_test_isolation.py, which fails if config gains a credential that
# conftest does not stub.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # so it can be run by hand from the Actions tab

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false    # one OS failing should not hide the other's result
      matrix:
        # Developed on Windows, so Windows is the one that must stay green.
        # Ubuntu is here as the outside check: it is where a hard-coded
        # backslash, a case-insensitive filename collision or a cp1252
        # assumption shows up, and none of those are visible on the machine
        # that wrote them.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # From requirements.txt only. Installing anything else here would let
        # the suite pass on a dependency the file does not declare, which is
        # the same failure this workflow exists to catch.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm no .env is present
        # The suite claims it needs no credentials. This makes that claim
        # falsifiable rather than assumed: if .env ever appears here, the
        # results below stop meaning anything.
        shell: bash
        run: test ! -f .env && echo "no .env - credentials come from conftest only"

      - name: Run tests
        run: python -m pytest -q
